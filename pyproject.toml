[project]
name = "subset-state-entanglement"
version = "1.0.0"
description = "Numerical and analytical tools for support-size entanglement trajectories of random subset states"
readme = "README.md"
keywords = ["subset states", "quantum entanglement", "support size", "random quantum states", "purity", "arithmetic quantum states"]
requires-python = ">=3.10"
authors = [
  {name = "Ruge Lin"},
  {name = "Germán Sierra"},
  {name = "José I. Latorre"},
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/GoGoKo699/Subset-states"
Manuscript = "https://github.com/GoGoKo699/Subset-states/blob/main/PAPER.md"
Preprint = "https://arxiv.org/abs/2501.06292"
Citation = "https://github.com/GoGoKo699/Subset-states/blob/main/docs/CITING.md"
Reproducibility = "https://github.com/GoGoKo699/Subset-states/blob/main/docs/REPRODUCIBILITY.md"

[tool.setuptools]
packages = ["subset_states"]
